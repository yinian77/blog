<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一念</title>
    <meta name="description" content="一念 — 记录与思考" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0e1412;
        --mist: #d8e6df;
        --foam: #f3f7f4;
        --leaf: #3d8f6a;
        --leaf-bright: #5cbc8a;
        --glow: rgba(92, 188, 138, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Outfit", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--foam);
        background: var(--ink);
        overflow: hidden;
      }

      .scene {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        isolation: isolate;
      }

      .bg {
        position: absolute;
        inset: 0;
        z-index: -3;
        overflow: hidden;
        pointer-events: none;
      }

      .bg-base {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, #070b09 0%, #101916 40%, #0a1210 100%);
      }

      .aurora {
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(ellipse 45% 40% at 20% 30%, rgba(61, 143, 106, 0.55), transparent 60%),
          radial-gradient(ellipse 40% 45% at 80% 20%, rgba(42, 110, 95, 0.45), transparent 55%),
          radial-gradient(ellipse 50% 40% at 60% 80%, rgba(92, 188, 138, 0.28), transparent 60%),
          radial-gradient(ellipse 35% 35% at 30% 75%, rgba(30, 90, 70, 0.4), transparent 55%);
        filter: blur(40px);
        animation: aurora-shift 16s ease-in-out infinite;
        will-change: transform;
      }

      .wave {
        position: absolute;
        left: -10%;
        width: 120%;
        height: 45%;
        opacity: 0.35;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(92, 188, 138, 0.25) 35%,
          rgba(61, 143, 106, 0.35) 50%,
          rgba(92, 188, 138, 0.2) 65%,
          transparent 100%
        );
        filter: blur(28px);
        border-radius: 50%;
        mix-blend-mode: screen;
      }

      .wave-a {
        top: 18%;
        animation: wave-drift 12s ease-in-out infinite;
      }

      .wave-b {
        bottom: 10%;
        opacity: 0.22;
        animation: wave-drift 18s ease-in-out infinite reverse;
        animation-delay: -4s;
      }

      .beam {
        position: absolute;
        top: -30%;
        width: 1px;
        height: 160%;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(214, 236, 224, 0.1),
          transparent
        );
        transform-origin: center top;
        opacity: 0.35;
      }

      .beam-a {
        left: 18%;
        transform: rotate(12deg);
        animation: beam-pulse 7s ease-in-out infinite;
      }

      .beam-b {
        left: 72%;
        transform: rotate(-8deg);
        animation: beam-pulse 9s 1.2s ease-in-out infinite;
      }

      .beam-c {
        left: 88%;
        transform: rotate(6deg);
        animation: beam-pulse 8s 2.4s ease-in-out infinite;
      }

      .particles {
        position: absolute;
        inset: 0;
      }

      .particle {
        position: absolute;
        bottom: -8px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(216, 230, 223, 0.75);
        box-shadow: 0 0 8px rgba(92, 188, 138, 0.55);
        animation: float-up linear infinite;
        opacity: 0;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.35;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
        background-size: 180px;
        mix-blend-mode: soft-light;
        animation: grain 8s steps(6) infinite;
        pointer-events: none;
      }

      .panel {
        position: relative;
        z-index: 1;
        width: min(100%, 560px);
        text-align: center;
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .brand {
        font-family: "Noto Serif SC", serif;
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: 0.28em;
        line-height: 1;
        margin-left: 0.28em;
        background: linear-gradient(180deg, var(--foam) 20%, var(--mist) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 28px var(--glow));
      }

      .tagline {
        margin-top: 1.25rem;
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        color: color-mix(in srgb, var(--mist) 78%, transparent);
      }

      .actions {
        margin-top: 2.75rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.6rem;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease,
          color 0.25s ease;
      }

      .btn-primary {
        color: var(--ink);
        background: linear-gradient(135deg, var(--leaf-bright), var(--leaf));
        box-shadow: 0 10px 30px rgba(61, 143, 106, 0.35);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 36px rgba(61, 143, 106, 0.45);
      }

      .btn-ghost {
        color: var(--mist);
        border: 1px solid color-mix(in srgb, var(--mist) 28%, transparent);
        background: color-mix(in srgb, var(--foam) 4%, transparent);
        backdrop-filter: blur(8px);
      }

      .btn-ghost:hover {
        transform: translateY(-2px);
        color: var(--foam);
        border-color: color-mix(in srgb, var(--mist) 55%, transparent);
      }

      .btn svg {
        width: 1em;
        height: 1em;
        transition: transform 0.25s ease;
      }

      .btn-primary:hover svg {
        transform: translateX(3px);
      }

      .foot {
        position: absolute;
        bottom: 1.5rem;
        left: 0;
        right: 0;
        z-index: 1;
        text-align: center;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        color: color-mix(in srgb, var(--mist) 40%, transparent);
        animation: rise 1.2s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes aurora-shift {
        0%,
        100% {
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        33% {
          transform: translate(4%, -3%) scale(1.08) rotate(4deg);
        }
        66% {
          transform: translate(-5%, 4%) scale(0.96) rotate(-3deg);
        }
      }

      @keyframes wave-drift {
        0%,
        100% {
          transform: translateX(-4%) translateY(0) scaleX(1);
        }
        50% {
          transform: translateX(6%) translateY(12px) scaleX(1.08);
        }
      }

      @keyframes beam-pulse {
        0%,
        100% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.55;
        }
      }

      @keyframes float-up {
        0% {
          transform: translateY(0) scale(0.6);
          opacity: 0;
        }
        12% {
          opacity: 0.85;
        }
        80% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-105vh) scale(1.1);
          opacity: 0;
        }
      }

      @keyframes grain {
        0%,
        100% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-2%, 1%);
        }
        40% {
          transform: translate(1%, -2%);
        }
        60% {
          transform: translate(2%, 1%);
        }
        80% {
          transform: translate(-1%, -1%);
        }
      }

      @media (max-width: 480px) {
        .brand {
          letter-spacing: 0.18em;
          margin-left: 0.18em;
        }

        .tagline {
          font-size: 0.95rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .aurora,
        .wave,
        .beam,
        .particle,
        .grain {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="bg" aria-hidden="true">
        <div class="bg-base"></div>
        <div class="aurora"></div>
        <div class="wave wave-a"></div>
        <div class="wave wave-b"></div>
        <div class="beam beam-a"></div>
        <div class="beam beam-b"></div>
        <div class="beam beam-c"></div>
        <div class="particles" id="particles"></div>
      </div>
      <div class="grain" aria-hidden="true"></div>

      <section class="panel">
        <h1 class="brand">一念</h1>
        <p class="tagline">记录与思考，从这里开始</p>
        <div class="actions">
          <a class="btn btn-primary" href="/blog/">
            进入博客
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <a class="btn btn-ghost" href="https://github.com/yinian77" target="_blank" rel="noopener">
            GitHub
          </a>
        </div>
      </section>

      <p class="foot">© 一念</p>
    </main>

    <script>
      (function () {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const root = document.getElementById("particles");
        const count = Math.min(36, Math.floor(window.innerWidth / 28));

        for (let i = 0; i < count; i++) {
          const el = document.createElement("span");
          el.className = "particle";
          const size = 1.5 + Math.random() * 2.5;
          el.style.left = Math.random() * 100 + "%";
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.animationDuration = 8 + Math.random() * 14 + "s";
          el.style.animationDelay = -Math.random() * 16 + "s";
          root.appendChild(el);
        }
      })();
    </script>
  </body>
</html>
